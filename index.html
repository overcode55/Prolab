<!DOCTYPE html>
<html>
<head>
    <title>Prolab</title>
    <link rel="stylesheet" href="index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/favicon/favicon.png">
</head>
<body>
  <div id = "main">
    <div id = "topbar">
      <div id = "logo">
        <button>
          <img src = "assets/favicon/favicon.png">
        </button>
      </div>
      <div id = "buttons">
        <button>home 
          <span class="arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </button>
        <button>store 
          <span class="arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </button>
        <button>requests 
          <span class="arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </button>
      </div>
      <div id = "side-buttons">
        <button>
          <img src = "assets/pfp_white.png">
        </button>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>

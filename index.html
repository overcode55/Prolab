<!DOCTYPE html>
<html>
<head>
    <title>Prolab</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class = "content">
    <div class = "sidebar">
      <div class = "top-sidebar">
        <button class="profile-btn" type="button">
            <img src="assets/pfp_white.png" alt="Profile" class = "profile-pfp">
        </button>
      </div>
      <div class = "profile-sidebar">
        <div class = "user-info">
          <div class = "pfp-sidebar-user">
            <div class = "loggedIn">
              <img src="assets/pfp_white.png" alt="Profile" class = "profile-pfp-sidebar">
              <p class = "username">a</p>
            </div>
            <div class = "loggedOut noshow">
              <div class = "close"></div>
              <button class = "pfp-sidebar-close-btn" type="button">X</button>
              <h1 class = "register-text">Register</h1>
            </div>
          </div>
          <div class = "pfp-sidebar-info">
          </div>
        </div>
      </div>
    </div>
    <div class = "main-content">
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
